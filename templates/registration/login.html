{% extends "base.html" %}

{% block content %}

<div class="container py-5" style="max-width: 500px;">

  <div class="card shadow-sm">

    <div class="card-body">

      <h1 class="mb-4">
        Sign In
      </h1>

      <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
          type="submit"
          class="btn btn-primary">

          Sign In

        </button>

      </form>

    </div>

  </div>

</div>

{% endblock %}
