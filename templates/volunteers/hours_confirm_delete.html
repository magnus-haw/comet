{% extends "base.html" %}

{% block content %}

<div class="container py-5" style="max-width: 700px;">

  <div class="card shadow-sm">

    <div class="card-body">

      <h1 class="mb-4">
        Delete Submission
      </h1>

      <p>

        Are you sure you want to delete this submission?

      </p>

      <ul>

        <li>
          <strong>Date:</strong>
          {{ submission.service_date }}
        </li>

        <li>
          <strong>Hours:</strong>
          {{ submission.hours }}
        </li>

        <li>
          <strong>Description:</strong>
          {{ submission.description }}
        </li>

      </ul>

      <form method="post">

        {% csrf_token %}

        <button
          type="submit"
          class="btn btn-danger">

          Delete Submission

        </button>

        <a
          href="{% url 'volunteers:household_summary' submission.household_id %}"
          class="btn btn-secondary">

          Cancel

        </a>

      </form>

    </div>

  </div>

</div>

{% endblock %}
